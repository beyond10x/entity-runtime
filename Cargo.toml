[workspace]
resolver = "2"
members = [
  "crates/entity-core",
  "crates/entity-store",
  "crates/entity-query",
  "crates/entity-shell",
  "crates/entity-sqlite",
  "crates/entity-postgres",
  "crates/entity-remote",
  "crates/entity-graph",
  "crates/entity-mcp",
  "crates/entity-surface",
  "crates/entity-yaml",
  "crates/entity-cli",
  "crates/scan-support",
]

[workspace.package]
version = "0.17.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/entity-runtime"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
# The YAML reader. `serde_yaml` 0.9.34 is published as `+deprecated` and receives no fixes;
# `serde_yaml_ng` is the maintained continuation of the same code, same API. Nothing here depends
# on YAML beyond parsing a definition and printing a decision.
serde_yaml_ng = "0.10"
clap = { version = "4.6", features = ["derive"] }

# Every member opts in with `[lints] workspace = true`. `unsafe_code = "forbid"` cannot be lifted by
# an inner `allow`; `missing_docs` is raised to an error by the gate's `-D warnings`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
