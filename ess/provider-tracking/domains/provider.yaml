domain: entity-provider.tracking
summary: Explicit transient read policy for an Eventlog-backed Entity Runtime handle.

# This policy belongs to a live reader. It is never persisted in authority events,
# stored decisions, requests, receipts, or provider bindings.
# FullVerification is the existing constructors' default: every complete read
# obtains fresh provider content, and an open never reads or writes an open
# checkpoint. ProviderTracked is an explicit opt-in; a supported provider may
# attest to unchanged SQL-visible content or an exact append suffix.
# Unsupported or invalidated attestations fall back to complete verification.
# A ProviderTracked open verifies completely unless the store's owner enabled
# durable open checkpoints: then it verifies the persisted checkpoint of the
# last completely verified observation, the provider's proof that only
# acknowledged appends followed it, and those appends. SQLite tracking covers
# SQL writes through any connection, live or between opens; raw file edits
# bypassing SQLite are outside that guarantee and are checked by a
# FullVerification open or a complete read.
types:
  - name: entity-provider.tracking.CapturePolicy
    kind: enum
    variants: [FullVerification, ProviderTracked]
