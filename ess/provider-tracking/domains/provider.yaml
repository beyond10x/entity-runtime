domain: entity-provider.tracking
summary: Explicit transient read policy for an Eventlog-backed Entity Runtime handle.

# This policy belongs to a live reader. It is never persisted in authority events,
# stored decisions, requests, receipts, or provider bindings.
# FullVerification is the existing constructors' default: every complete read
# obtains fresh provider content. ProviderTracked is an explicit opt-in after a
# complete verification on open; a supported provider may attest to unchanged
# SQL-visible content or an exact append suffix. Unsupported or invalidated
# attestations fall back to complete verification. SQLite tracking covers SQL
# writes through any connection; raw file edits bypassing SQLite are outside
# the warm tracking guarantee and are checked when the handle opens again.
types:
  - name: entity-provider.tracking.CapturePolicy
    kind: enum
    variants: [FullVerification, ProviderTracked]
