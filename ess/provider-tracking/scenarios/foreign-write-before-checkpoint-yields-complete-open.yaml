type: ess-scenario/4
domain: entity-provider.tracking
scenario: foreign-write-before-checkpoint-yields-complete-open
summary: A foreign write after the last verified observation and before the drain that persists its checkpoint makes the next open complete.
# The write rewrites the stream identity with its own value: nothing changes, so the complete
# verification succeeds, but the provider records a write it did not acknowledge.
timeline:
  - at: 2026-10-07T00:00:00Z
    command: entity-provider.tracking.Register
    input:
      request: '{"definition":{"entity":"ticket","version":1,"schema":{"fields":{}},"lifecycle":{"initial":"Open","states":["Open"]},"operations":{"Touch":{"transitions":[{"from":"Open","to":"Open"}],"emits":[]}}}}'
    outcome: returned
    response: {status: ok}
  - at: 2026-10-07T00:00:01Z
    command: entity-provider.tracking.Provision
    input: {request: '{"policy":"ProviderTracked"}'}
    outcome: returned
    response: {status: ok}
  - at: 2026-10-07T00:00:02Z
    command: entity-provider.tracking.EnableDurableCheckpoints
    input: {request: '{}'}
    outcome: returned
    response: {status: ok}
  - at: 2026-10-07T00:00:03Z
    command: entity-provider.tracking.Create
    input:
      request: '{"entity":"ticket","id":"a","version":1,"fields":{},"recording":{"record_id":"create-a","recorded_at":"2026-10-07T00:00:00Z","actor":null,"correlation":null,"causation":null}}'
    outcome: returned
    response: {status: ok}
  - at: 2026-10-07T00:00:04Z
    command: entity-provider.tracking.SqlMutate
    input: {request: '{"kind":"rewrite-identity"}'}
    outcome: returned
    response: {status: ok, value: '{"changed":1,"same_event_head":true}'}
  - at: 2026-10-07T00:00:05Z
    command: entity-provider.tracking.Reopen
    input: {request: '{"policy":"ProviderTracked"}'}
    outcome: returned
    response: {status: ok, value: '{"open":"complete"}'}
  - at: 2026-10-07T00:00:06Z
    command: entity-provider.tracking.Load
    input: {request: '{"entity":"ticket","id":"a"}'}
    outcome: returned
    response: {status: ok, value: '{"entity":"ticket","fields":{},"id":"a","lifecycle_state":"Open","revision":1,"version":1}'}
  - at: 2026-10-07T00:00:07Z
    command: entity-provider.tracking.Reopen
    input: {request: '{"policy":"ProviderTracked"}'}
    outcome: returned
