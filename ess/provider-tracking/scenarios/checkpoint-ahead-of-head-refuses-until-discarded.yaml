type: ess-scenario/4
domain: entity-provider.tracking
scenario: checkpoint-ahead-of-head-refuses-until-discarded
summary: A store truncated behind its open checkpoint refuses ProviderTracked opens, not FullVerification ones, until the checkpoint is discarded.
# KeepCopy's drain writes the checkpoint at the first record's head into the kept copy; the second
# record's drain writes one at its own head; TruncateTail puts the first copy back with that newer
# checkpoint carried into it.
timeline:
  - at: 2026-10-07T00:00:00Z
    command: entity-provider.tracking.Register
    input:
      request: '{"definition":{"entity":"ticket","version":1,"schema":{"fields":{}},"lifecycle":{"initial":"Open","states":["Open"]},"operations":{"Touch":{"transitions":[{"from":"Open","to":"Open"}],"emits":[]}}}}'
    outcome: returned
    response: {status: ok}
  - at: 2026-10-07T00:00:01Z
    command: entity-provider.tracking.Provision
    input: {request: '{"policy":"ProviderTracked"}'}
    outcome: returned
    response: {status: ok}
