type: ess-scenario/4
domain: entity-provider.tracking
scenario: bounded-answers-equal-complete-answers
summary: Every state, history, batch and complete snapshot a handle opened from a checkpoint answers equals what a completely verified handle answers on the same store.
# The bounded handle answers states and batches from verified index rows and histories per
# entity; its complete snapshot is a complete verification, which is why it is read last.
