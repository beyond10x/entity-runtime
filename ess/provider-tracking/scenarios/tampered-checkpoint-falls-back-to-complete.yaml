type: ess-scenario/4
domain: entity-provider.tracking
scenario: tampered-checkpoint-falls-back-to-complete
summary: A checkpoint changed without its digest is discarded; the open verifies completely and its drain writes a valid checkpoint again.
# The checkpoint is a cache: a damaged one costs a complete verification, never a refusal.
timeline:
