    command: entity-provider.tracking.Register
    input:
      request: '{"definition":{"entity":"ticket","version":1,"schema":{"fields":{}},"lifecycle":{"initial":"Open","states":["Open"]},"operations":{"Touch":{"transitions":[{"from":"Open","to":"Open"}],"emits":[]}}}}'
    outcome: returned
    response: {status: ok}
  - at: 2026-10-07T00:00:01Z
    command: entity-provider.tracking.Provision
    input: {request: '{"policy":"ProviderTracked"}'}
    outcome: returned
    response: {status: ok}
  - at: 2026-10-07T00:00:02Z
    command: entity-provider.tracking.EnableDurableCheckpoints
    input: {request: '{}'}
    outcome: returned
    response: {status: ok}
  - at: 2026-10-07T00:00:03Z
    command: entity-provider.tracking.Create
    input:
      request: '{"entity":"ticket","id":"a","version":1,"fields":{},"recording":{"record_id":"create-a","recorded_at":"2026-10-07T00:00:00Z","actor":null,"correlation":null,"causation":null}}'
    outcome: returned
    response: {status: ok}
  - at: 2026-10-07T00:00:04Z
    command: entity-provider.tracking.Reopen
    input: {request: '{"policy":"ProviderTracked"}'}
