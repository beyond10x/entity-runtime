      "input": {
        "definition": "{\"entity\":\"probe\",\"version\":1,\"semantics\":\"service/1\",\"schema\":{\"fields\":{\"payee\":{\"type\":\"union\",\"tag\":\"kind\",\"required\":true,\"variants\":{\"person\":{\"type\":\"string\",\"required\":true}}}}},\"lifecycle\":{\"initial\":\"Held\",\"states\":[\"Held\"]},\"invariants\":[{\"name\":\"three\",\"assert\":{\"compare\":{\"left\":\"$fields.payee.value.count\",\"op\":\"eq\",\"right\":3}},\"message\":\"three\"}]}",
        "id": "p-1",
        "fields": "{\"payee\":{\"kind\":\"person\",\"value\":\"Ann\"}}"
      },
      "outcome": "returned",
      "response": {
        "status": "error",
        "error_kind": "invariant_unobservable",
        "unresolved": [
          "$fields.payee.value.count"
        ]
      }
