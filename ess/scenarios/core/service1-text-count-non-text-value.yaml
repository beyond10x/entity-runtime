        "definition": "{\"entity\":\"probe\",\"version\":1,\"semantics\":\"service/1\",\"schema\":{\"fields\":{\"name\":{\"type\":\"string\",\"required\":true}}},\"lifecycle\":{\"initial\":\"Held\",\"states\":[\"Held\"]},\"operations\":{\"Rename\":{\"transitions\":[{\"from\":\"Held\",\"to\":\"Held\"}],\"arguments\":{\"fields\":{\"name\":{\"type\":\"string\",\"required\":true}}},\"preconditions\":[{\"name\":\"short\",\"assert\":{\"compare\":{\"left\":\"$fields.name.count\",\"op\":\"lte\",\"right\":5}},\"message\":\"the current name is at most five characters\"}],\"set\":{\"name\":\"$args.name\"}}}}",
        "instance": "{\"entity\":\"probe\",\"version\":1,\"id\":\"p-1\",\"lifecycle_state\":\"Held\",\"revision\":1,\"fields\":{\"name\":{\"count\":1}}}",
        "operation": "Rename",
        "arguments": "{\"name\":\"Bo\"}"
