        "definition": "{\"entity\":\"probe\",\"version\":1,\"semantics\":\"service/1\",\"schema\":{\"fields\":{\"code\":{\"type\":\"string\",\"alphabet\":\"0123456789*#ABCD\",\"default\":\"12#\"}}},\"lifecycle\":{\"initial\":\"Held\",\"states\":[\"Held\"]}}"
      },
      "outcome": "returned",
      "response": {
        "status": "ok"
      }
    },
    {
      "at": "2026-10-06T00:00:01Z",
      "command": "entity.core.ValidateDefinition",
      "input": {
        "definition": "{\"entity\":\"probe\",\"version\":1,\"semantics\":\"service/1\",\"schema\":{\"fields\":{\"code\":{\"type\":\"string\",\"alphabet\":\"0123456789*#ABCD\",\"default\":\"12x\"}}},\"lifecycle\":{\"initial\":\"Held\",\"states\":[\"Held\"]}}"
