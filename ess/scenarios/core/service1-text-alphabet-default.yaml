{
  "type": "ess-scenario/4",
  "domain": "entity.core",
  "scenario": "service1-text-alphabet-default",
  "summary": "A default must satisfy its alphabet: one inside registers; one outside, on a field or an argument, is refused at registration naming the path and the character.",
  "timeline": [
