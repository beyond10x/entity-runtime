      "command": "entity.core.Execute",
      "input": {
        "definition": "{\"entity\":\"probe\",\"version\":1,\"semantics\":\"service/1\",\"schema\":{\"fields\":{\"keys\":{\"type\":\"string\"}}},\"lifecycle\":{\"initial\":\"Held\",\"states\":[\"Held\"]},\"operations\":{\"Dial\":{\"transitions\":[{\"from\":\"Held\",\"to\":\"Held\"}],\"arguments\":{\"fields\":{\"keys\":{\"type\":\"string\",\"required\":true,\"alphabet\":\"0123456789*#ABCD\"}}},\"set\":{\"keys\":\"$args.keys\"}}}}",
        "instance": "{\"entity\":\"probe\",\"version\":1,\"id\":\"p-1\",\"lifecycle_state\":\"Held\",\"revision\":1,\"fields\":{}}",
        "operation": "Dial",
        "arguments": "{\"keys\":\"12#\"}"
      },
      "outcome": "returned",
      "response": {
        "status": "ok"
      }
    },
    {
      "at": "2026-10-06T00:00:01Z",
      "command": "entity.core.Execute",
      "input": {
        "definition": "{\"entity\":\"probe\",\"version\":1,\"semantics\":\"service/1\",\"schema\":{\"fields\":{\"keys\":{\"type\":\"string\"}}},\"lifecycle\":{\"initial\":\"Held\",\"states\":[\"Held\"]},\"operations\":{\"Dial\":{\"transitions\":[{\"from\":\"Held\",\"to\":\"Held\"}],\"arguments\":{\"fields\":{\"keys\":{\"type\":\"string\",\"required\":true,\"alphabet\":\"0123456789*#ABCD\"}}},\"set\":{\"keys\":\"$args.keys\"}}}}",
        "instance": "{\"entity\":\"probe\",\"version\":1,\"id\":\"p-1\",\"lifecycle_state\":\"Held\",\"revision\":1,\"fields\":{}}",
        "operation": "Dial",
        "arguments": "{\"keys\":\"1x2y\"}"
      },
      "outcome": "returned",
      "response": {
        "status": "error",
        "error_kind": "validation",
