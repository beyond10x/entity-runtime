domain: entity.store
summary: Public storage calls preserve explicit expectations, complete records, provider capabilities and assurance boundaries.
# Each RequestDocument is lossless JSON for the named Rust call. The traceability register
# identifies its exact fields and separates filesystem fixture arrangement from public APIs.
# Refused Rust Results are returned values, never a fabricated domain event or state change.
types:
  - {name: entity.store.Provider, kind: enum, variants: [Memory, File, RecordedMemory]}
  - {name: entity.store.Expectation, kind: enum, variants: [Absent, Revision]}
  - {name: entity.store.RequestDocument, kind: newtype, of: entity.core.JsonDocument}
  - {name: entity.store.HistoryDocument, kind: newtype, of: entity.core.JsonDocument}
  - {name: entity.store.ReceiptDocument, kind: newtype, of: entity.core.JsonDocument}
commands:
  - name: entity.store.Commit
    input:
      - {name: request, type: entity.store.RequestDocument}
    response:
      - {name: status, type: String}
      - {name: error, type: String}
      - {name: value, type: entity.core.JsonDocument}
    outcomes:
      - {name: returned, returns: true}
