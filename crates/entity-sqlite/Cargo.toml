[package]
name = "entity-sqlite"
description = "A transactional entity store over SQLite: the provider that can write state and events atomically."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
eventlog-facade = ["dep:entity-eventlog", "dep:entity-query", "dep:eventlog-core", "dep:time"]

[dependencies]
entity-core = { path = "../entity-core", version = "0.18.1" }
entity-eventlog = { path = "../entity-eventlog", version = "0.18.1", features = ["sync-bridge", "sqlite"], optional = true }
entity-query = { path = "../entity-query", version = "0.18.1", optional = true }
entity-store = { path = "../entity-store", version = "0.18.1" }
eventlog-core = { git = "https://github.com/beyond10x/eventlog", rev = "9a2a6df868e00acc8f30b6e22e208086b8d5860d", optional = true }
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3", optional = true }
# `bundled`: SQLite is compiled from vendored C rather than linked against whatever the machine
# happens to have. A store whose behaviour depends on the host's library version is a store two
# machines can disagree about, which is the one thing a provider must not be.
# Match the pinned Eventlog SQLite provider: Cargo permits only one sqlite3 native-link package
# in the composed workspace.
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[lints]
workspace = true
