# Applies to `design` and, by kind-hierarchy fallback, to every design subkind that declares no
# lifecycle of its own — feature, component, api and data designs included.
kind: design
initial: draft

transitions:
  draft: [in_review, archived]
  # Back to draft when a review asks for changes; `rejected` is for a design that is not going to be
  # rewritten, so the two outcomes stay distinguishable after the fact.
  in_review: [draft, approved, rejected]
  # `implemented` is not the end of a design's usefulness — it is the point at which the system is
  # supposed to match it, which is what makes a stale approved design worth catching.
  approved: [implemented, superseded, archived]
  implemented: [superseded, archived]
  rejected: [archived]
  superseded: [archived]
  archived: []

# One line per rung, for anything that renders this ladder as a board and would otherwise
# carry its own map of status to blurb — a second copy of this vocabulary, in a file
# nothing validates. Prose about *this* ladder's rungs: `draft` here is not `draft`
# everywhere.
descriptions:
  draft: Being written.
  in_review: Written, and waiting on somebody to read it.
  approved: Agreed, and not yet built.
  implemented: Built as described.
  rejected: Decided against.
  superseded: Replaced by a later design, kept because the reasoning is still readable.
  archived: Closed, kept for the record.
