[package]
name = "entity-mcp"
description = "A synchronous stdio MCP tool surface over validated entities and a store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Repository tooling only: the KPI gate (`checks/kpi`) reads the counters this enables. A relaxed
# atomic add per counted event; no production build turns it on.
kpi-counters = []

[dependencies]
entity-core = { path = "../entity-core", version = "0.32.0" }
entity-shell = { path = "../entity-shell", version = "0.32.0" }
entity-store = { path = "../entity-store", version = "0.32.0" }
entity-surface = { path = "../entity-surface", version = "0.32.0" }
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Validate generated tool schemas with a real, offline JSON Schema evaluator (MSRV 1.85).
jsonschema = { version = "=0.49.9", default-features = false }
