[package]
name = "entity-cli"
description = "The `entity` command: the reference shell around entity-core — validate, inspect, graph, create, execute"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "entity"
path = "src/main.rs"

[dependencies]
entity-core = { path = "../entity-core", version = "0.17.7" }
entity-graph = { path = "../entity-graph", version = "0.17.7" }
entity-mcp = { path = "../entity-mcp", version = "0.17.7" }
entity-shell = { path = "../entity-shell", version = "0.17.7" }
entity-surface = { path = "../entity-surface", version = "0.17.7" }
# The shell's half of R-80: the CLI is a shell, so this is where a store belongs.
entity-store = { path = "../entity-store", version = "0.17.7" }
entity-yaml = { path = "../entity-yaml", version = "0.17.7" }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
clap.workspace = true

[lints]
workspace = true
