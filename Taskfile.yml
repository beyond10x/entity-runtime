# The gate. `task check` is the measurement; CI runs the same steps in the same order.
version: '3'

tasks:
  check:
    desc: The full gate — run this before claiming anything works
    cmds:
      - task: fmt-check
      - task: clippy
      - task: test
      - task: doc-check
      - task: example-check
      - task: req-check
      - task: pin-check
      - task: postgres-check
      - task: eventlog-runtime-check
      - task: notes-check
      - task: ess-check
      - task: provider-ess-check

  provider-ess-check:
    desc: SQLite tracked-provider contract against real facade calls and external SQL mutations
    env:
      CARGO_TARGET_DIR: '{{.ER_ESS_TARGET_DIR | default "checks/ess-conformance/target"}}'
    cmds:
      - cargo +1.91.0 clippy --manifest-path checks/ess-conformance/Cargo.toml --features eventlog --all-targets --locked -- -D warnings
      - cargo +1.91.0 run --manifest-path checks/ess-conformance/Cargo.toml --features eventlog --locked -- --spec-root ess/provider-tracking check --reports target/provider-ess-conformance

  ess-check:
    desc: Deterministic ESS compilation, reviewed scenario coverage and actual library conformance
    env:
      CARGO_TARGET_DIR: '{{.ER_ESS_TARGET_DIR | default "checks/ess-conformance/target"}}'
    cmds:
      - cargo fmt --manifest-path checks/ess-conformance/Cargo.toml -- --check
      - cargo clippy --manifest-path checks/ess-conformance/Cargo.toml --all-targets --locked -- -D warnings
      - cargo run --manifest-path checks/ess-conformance/Cargo.toml --locked -- check

  ess-regenerate:
    desc: Regenerate ESS artifacts; changed scenario assertions require --coverage-review
    env:
      CARGO_TARGET_DIR: '{{.ER_ESS_TARGET_DIR | default "checks/ess-conformance/target"}}'
    cmds:
      - cargo run --manifest-path checks/ess-conformance/Cargo.toml --locked -- regenerate {{.CLI_ARGS}}

  eventlog-runtime-check:
    desc: the Rust 1.91 Eventlog adapter closure with every native provider and synchronous bridge
    cmds:
      - cargo +1.91.0 test -p entity-eventlog --all-features --locked
      - cargo +1.91.0 clippy -p entity-eventlog --all-targets --all-features --no-deps --locked -- -D warnings

  postgres-check:
    desc: the Postgres provider's tests, against the server ENTITY_POSTGRES_URL names — or one line saying they did not run
    cmds:
      - scripts/postgres-check.sh

  notes-check:
    desc: The release-notes reflow still handles tables, fences and list boundaries.
    # Cheap, and it guards something nobody proofreads: the notes a release publishes are generated,
    # so a reflow that quietly ate a table would ship as a broken page and be found by a reader.
    cmds:
      - python3 scripts/changelog-section.py --self-test

  fmt-check:
    desc: rustfmt, check only
    cmds:
      - cargo fmt --all -- --check

  clippy:
    desc: clippy over every target, warnings are errors (this is what makes missing_docs fatal)
    cmds:
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    desc: every unit, integration and doc test
    cmds:
      - cargo test --workspace --locked

  doc-check:
    desc: rustdoc with broken intra-doc links as errors
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo doc --workspace --no-deps --locked

  example-check:
    desc: every shipped example definition validates through the CLI
    cmds:
      - cargo run -q -p entity-cli --locked -- validate examples/*.yaml
      - cargo run -q -p entity-cli --locked -- validate examples/aep/*.yaml
      - cargo run -q -p entity-cli --locked -- validate examples/references/*.yaml

  req-check:
    desc: every requirement in docs/requirements.md is cited by the design and pinned by a test that exists
    cmds:
      - python3 scripts/check-requirements.py

  pin-check:
    desc: every pinned upstream fixture still hashes to what its PIN.md records
    cmds:
      - python3 scripts/check-pin.py

  plan-check:
    desc: separate consumer compatibility check, after ER and AEP sources are composed
    # The local command must support the Git-native planning layout. CI builds the exact AEP
    # revision pinned by planning.yml; this guard checks the local `aep` the next line runs.
    # Resolve it in the shell because Cargo prepends directories to its child's PATH.
    cmds:
      - cargo run -q -p entity-xtask --locked -- aep-version --binary "$(command -v aep)"
      - aep plan artifact validate

  fmt:
    desc: rustfmt, in place
    cmds:
      - cargo fmt --all

  demo:
    desc: walk an order through its lifecycle with the CLI
    cmds:
      - cargo run -q -p entity-cli -- graph examples/order.yaml
      - cargo run -q -p entity-cli -- create --definition examples/order.yaml --id ord-1 --fields '{"customer_id":"c-1","total_cents":2599}' --format text

  # The site is not a step of `check`: `npm ci` reaches the registry and `check` reaches no network.
  # It is gated in CI by .github/workflows/pages.yml on every push and pull request.
  site-build:
    desc: install and build the Docusaurus site (network)
    dir: website
    cmds:
      - npm ci
      - npm run typecheck
      - npm run build

  site-start:
    desc: run the site locally with live reload
    dir: website
    cmds:
      - npm run start
