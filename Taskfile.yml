# The gate. `task check` is the measurement; CI runs the same steps in the same order.
version: '3'

tasks:
  check:
    desc: The full gate — run this before claiming anything works
    cmds:
      - task: fmt-check
      - task: clippy
      - task: test
      - task: doc-check
      - task: example-check
      - task: req-check
      - task: pin-check
      - task: plan-check
      - task: postgres-check
      - task: notes-check

  postgres-check:
    desc: the Postgres provider's tests, against the server ENTITY_POSTGRES_URL names — or one line saying they did not run
    cmds:
      - scripts/postgres-check.sh

  notes-check:
    desc: The release-notes reflow still handles tables, fences and list boundaries.
    # Cheap, and it guards something nobody proofreads: the notes a release publishes are generated,
    # so a reflow that quietly ate a table would ship as a broken page and be found by a reader.
    cmds:
      - python3 scripts/changelog-section.py --self-test

  fmt-check:
    desc: rustfmt, check only
    cmds:
      - cargo fmt --all -- --check

  clippy:
    desc: clippy over every target, warnings are errors (this is what makes missing_docs fatal)
    cmds:
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    desc: every unit, integration and doc test
    cmds:
      - cargo test --workspace --locked

  doc-check:
    desc: rustdoc with broken intra-doc links as errors
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo doc --workspace --no-deps --locked

  example-check:
    desc: every shipped example definition validates through the CLI
    cmds:
      - cargo run -q -p entity-cli --locked -- validate examples/*.yaml
      - cargo run -q -p entity-cli --locked -- validate examples/aep/*.yaml
      - cargo run -q -p entity-cli --locked -- validate examples/references/*.yaml

  req-check:
    desc: every requirement in docs/requirements.md is cited by the design and pinned by a test that exists
    cmds:
      - python3 scripts/check-requirements.py

  pin-check:
    desc: every pinned upstream fixture still hashes to what its PIN.md records
    cmds:
      - python3 scripts/check-pin.py

  plan-check:
    desc: the planning store validates, with a `protocol` new enough to be trusted with it
    # The version first, and it is not ceremony. `protocol artifact` is the only thing that writes
    # this store, and it is ambient — nothing here pins it. A build predating the store journal
    # printed every status move it made and recorded none of them, and `artifact validate` stayed
    # green because it reads the files and the files were fine.
    cmds:
      - cargo run -q -p entity-xtask --locked -- protocol-version
      - protocol artifact validate

  fmt:
    desc: rustfmt, in place
    cmds:
      - cargo fmt --all

  demo:
    desc: walk an order through its lifecycle with the CLI
    cmds:
      - cargo run -q -p entity-cli -- graph examples/order.yaml
      - cargo run -q -p entity-cli -- create --definition examples/order.yaml --id ord-1 --fields '{"customer_id":"c-1","total_cents":2599}' --format text

  # The site is not a step of `check`: `npm ci` reaches the registry and `check` reaches no network.
  # It is gated in CI by .github/workflows/pages.yml on every push and pull request.
  site-build:
    desc: install and build the Docusaurus site (network)
    dir: website
    cmds:
      - npm ci
      - npm run typecheck
      - npm run build

  site-start:
    desc: run the site locally with live reload
    dir: website
    cmds:
      - npm run start
