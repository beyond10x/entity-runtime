# The AEP `initiative` lifecycle, expressed as an entity definition.
#
# Phase 1 of `docs/design/aep-adoption-v0.1.md`: the transitions map in
# `aep` `artifacts/lifecycles/initiative.yaml` at `4e6279b` — a Rust
# `LifecycleRegistry` consults it and nothing else — carried here as data a kernel executes.
# `crates/entity-yaml/tests/aep_lifecycles.rs` proves the two say the same thing.
#
# The largest unit of intent: what is being attempted and why.
#
# No rules yet: phase 1 is edge equivalence only. Preconditions arrive with phase 3, once a rule
# can say `unknown`.

entity: initiative
version: 1

schema:
  additional_fields: false
  fields:
    # `id`, `kind` and `status` are not fields: the kernel owns identity and the lifecycle state,
    # and writing either as a field is how a status becomes something anybody can set.
    title:
      type: string
      required: true
      min_length: 1

    summary:
      type: string

    owner:
      type: string

    tags:
      type: array
      default: []
      items:
        type: string

    # The markdown body, unmodelled for now. `artifacts/kinds/*.yaml` declares `required_sections`
    # there; modelling those as fields is a later step, and this is what the design calls keeping
    # the body as json in the first one.
    body:
      type: json

lifecycle:
  initial: draft
  states:
    - draft
    - proposed
    - active
    - implemented
    - rejected
    - archived

create:
  emit:
    type: ArtifactCreated
    payload:
      artifact_id: $id
      kind: $entity
      status: $state
      title: $fields.title

operations:
  # Refined and agreed enough to pick up.
  propose:
    arguments:
      fields:
        actor:
          type: string
          required: true
          min_length: 1
    transitions:
      - from: draft
        to: proposed
    emits:
      - type: ArtifactMoved
        payload:
          artifact_id: $id
          kind: $entity
          operation: propose
          from: $from_state
          to: $to_state
          actor: $args.actor

  # A proposal sent back for more refinement.
  return:
    arguments:
      fields:
        actor:
          type: string
          required: true
          min_length: 1
    transitions:
      - from: proposed
        to: draft
    emits:
      - type: ArtifactMoved
        payload:
          artifact_id: $id
          kind: $entity
          operation: return
          from: $from_state
          to: $to_state
          actor: $args.actor

  # Work starts.
  activate:
    arguments:
      fields:
        actor:
          type: string
          required: true
          min_length: 1
    transitions:
      - from: proposed
        to: active
    emits:
      - type: ArtifactMoved
        payload:
          artifact_id: $id
          kind: $entity
          operation: activate
          from: $from_state
          to: $to_state
          actor: $args.actor

  # It will not be done — a different fact from being dropped from a backlog.
  reject:
    arguments:
      fields:
        actor:
          type: string
          required: true
          min_length: 1
    transitions:
      - from: proposed
        to: rejected
    emits:
      - type: ArtifactMoved
        payload:
          artifact_id: $id
          kind: $entity
          operation: reject
          from: $from_state
          to: $to_state
          actor: $args.actor

  # Realised in the system.
  implement:
    arguments:
      fields:
        actor:
          type: string
          required: true
          min_length: 1
    transitions:
      - from: active
        to: implemented
    emits:
      - type: ArtifactMoved
        payload:
          artifact_id: $id
          kind: $entity
          operation: implement
          from: $from_state
          to: $to_state
          actor: $args.actor

  # Kept for the record only.
  archive:
    arguments:
      fields:
        actor:
          type: string
          required: true
          min_length: 1
    transitions:
      - from: [draft, active, implemented, rejected]
        to: archived
    emits:
      - type: ArtifactMoved
        payload:
          artifact_id: $id
          kind: $entity
          operation: archive
          from: $from_state
          to: $to_state
          actor: $args.actor
