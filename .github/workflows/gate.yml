# The gate, in one place. `check.yml` and `release.yml` both call this workflow, so a tag can never
# be cut against a shorter gate than a pull request had to pass — which is exactly what happened
# when the two carried hand-copied step lists and only one of them ran `cargo doc`.
#
# These steps mirror `task check` in Taskfile.yml, in the same order, minus `plan-check`, which
# needs the `protocol` CLI from engineering-protocols and is a local discipline.
name: Gate

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The one provider that needs a server gets one here, and nowhere else: `task check` on a
    # laptop prints that the Postgres tests were skipped, and this job is where they run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: entity
          POSTGRES_PASSWORD: entity
          POSTGRES_DB: entity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENTITY_POSTGRES_URL: postgres://entity:entity@127.0.0.1:5432/entity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # `--locked` throughout: the gate must judge the dependency set the repository committed,
      # not one cargo re-resolved on the way past.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Examples
        run: cargo run -q -p entity-cli --locked -- validate examples/*.yaml

      - name: Requirements
        run: python3 scripts/check-requirements.py

      - name: Postgres provider
        run: scripts/postgres-check.sh

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `rust-version = "1.85"` in Cargo.toml is a promise to anyone who depends on these crates.
      # Until this job existed nothing in the repository would have noticed it breaking — a
      # dependency raising its own MSRV is enough.
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build on the declared MSRV
        run: cargo build --workspace --locked
