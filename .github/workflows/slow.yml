name: Slow lane

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/slow.yml
      - Cargo.lock
      - Cargo.toml
      - Taskfile.yml
      - examples/refund.yaml
      - crates/entity-cli/Cargo.toml
      - crates/entity-cli/src/**
      - crates/entity-cli/tests/cli.rs
      - crates/entity-cli/tests/fixtures/generated-rust-cli/**
      - crates/entity-core/**
      - crates/entity-shell/**
      - crates/entity-store/**
      - crates/entity-yaml/**
      - crates/scan-support/**
  pull_request:
    paths:
      - .github/workflows/slow.yml
      - Cargo.lock
      - Cargo.toml
      - Taskfile.yml
      - examples/refund.yaml
      - crates/entity-cli/Cargo.toml
      - crates/entity-cli/src/**
      - crates/entity-cli/tests/cli.rs
      - crates/entity-cli/tests/fixtures/generated-rust-cli/**
      - crates/entity-core/**
      - crates/entity-shell/**
      - crates/entity-store/**
      - crates/entity-yaml/**
      - crates/scan-support/**

concurrency:
  group: slow-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  generated-rust-cli:
    name: Generated Rust CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Lint the slow-lane tests
        run: cargo clippy -p entity-cli --all-targets --features slow-lane --locked -- -D warnings

      - name: Compile and run the generated Rust CLI
        run: cargo test -p entity-cli --features slow-lane --locked --test cli -- slow_lane
