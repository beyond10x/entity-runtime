# Cuts a GitHub Release for every version tag: the gate first, then the `entity` command built for
# Linux (x86_64, aarch64), macOS (x86_64, arm64) and Windows (x86_64), then one release carrying
# the archives, a SHA256SUMS file and the tag's section of CHANGELOG.md as its notes.
#
# Tags are the bare version (`0.1.0`, atlas § Naming); the `v*` pattern is accepted so a tag pushed
# with the prefix still releases rather than silently doing nothing.
name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p entity-cli -- validate examples/*.yaml
      - run: python3 scripts/check-requirements.py

  build:
    name: Build ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `--locked`: the release ships exactly the dependency set Cargo.lock names.
      - name: Build the entity command
        run: cargo build --release --locked -p entity-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="entity-${TAG}-${TARGET}"
          mkdir -p "dist/${name}"
          cp LICENSE README.md CHANGELOG.md "dist/${name}/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "target/${TARGET}/release/entity.exe" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null)
            rm -r "dist/${name}"
          else
            cp "target/${TARGET}/release/entity" "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            rm -r "dist/${name}"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      # The notes are the tag's own section of CHANGELOG.md — the text written for the person
      # hitting the behaviour, not a commit list. A tag with no section gets GitHub's generated notes
      # and says so, rather than an empty page.
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; found = ($0 ~ "^## \\[" v "\\]") ; next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ -s notes.md ]]; then
            echo "notes: CHANGELOG.md section for ${version}"
            echo "GENERATE=false" >> "$GITHUB_ENV"
          else
            echo "notes: no CHANGELOG.md section for ${version}; using generated notes"
            printf 'No CHANGELOG.md section for %s.\n' "$version" > notes.md
            echo "GENERATE=true" >> "$GITHUB_ENV"
          fi
          cat notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--title "$TAG" --notes-file notes.md --verify-tag)
          if [[ "$GENERATE" == "true" ]]; then args+=(--generate-notes); fi
          gh release create "$TAG" dist/* "${args[@]}"
