# Cuts a GitHub Release for every version tag: the gate first — the same reusable workflow CI runs,
# so a tag cannot ship against a shorter one — then the `entity` command built for Linux (x86_64,
# aarch64), macOS (x86_64, arm64) and Windows (x86_64), then one release carrying the archives, a
# SHA256SUMS file and the tag's section of CHANGELOG.md as its notes.
#
# Tags are the bare version (`0.1.0`, atlas § Naming); the `v*` pattern is accepted so a tag pushed
# with the prefix still releases rather than silently doing nothing.
#
# Every action is pinned by commit: the release job holds a token that can publish, and a
# retargeted mutable tag would run inside it, beside the step that computes the checksums.
name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  provenance:
    name: Verify tag provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Tag, Cargo and changelog agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$TAG" = "$cargo_version"
          grep -Eq "^## \[$TAG\] — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md

  gate:
    needs: provenance
    uses: ./.github/workflows/gate.yml

  build:
    name: Build ${{ matrix.target }}
    needs: [provenance, gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      # `--locked`: the release ships exactly the dependency set Cargo.lock names.
      - name: Build the entity command
        run: cargo build --release --locked -p entity-cli --target ${{ matrix.target }}

      - name: Verify native filesystem persistence and concurrent writers
        run: cargo test --locked -p entity-store

      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="entity-${TAG}-${TARGET}"
          mkdir -p "dist/${name}"
          cp LICENSE README.md CHANGELOG.md "dist/${name}/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "target/${TARGET}/release/entity.exe" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}" > /dev/null)
            rm -r "dist/${name}"
          else
            cp "target/${TARGET}/release/entity" "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            rm -r "dist/${name}"
          fi
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      # The notes are the tag's own required section of CHANGELOG.md.
      #
      # Reflowed on the way out, because release notes render as **GFM** and GFM turns a single
      # newline into a `<br>`. Confirmed against GitHub's own `/markdown` endpoint, not assumed:
      # the 0.5.2 section carried five stray breaks before this and none after. CHANGELOG.md stays
      # wrapped at 100 columns, which is the right shape for a file somebody reviews in a diff;
      # only the notes are joined. `scripts/changelog-section.py --self-test` holds the shapes that
      # must survive — tables, fences, list boundaries, deliberate two-space breaks.
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          python3 scripts/changelog-section.py --self-test
          python3 scripts/changelog-section.py CHANGELOG.md "$version" > notes.md
          test -s notes.md
          cat notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
