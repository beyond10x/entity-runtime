name: Planning store

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: planning validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: repository
          fetch-depth: 0
          persist-credentials: false
      - name: The CI path list holds both sides
        working-directory: repository
        run: sh scripts/ci-paths-test.sh
      # The released binary of aep 0.68.0, whose tag is the source revision this workflow pinned
      # before (6d7a44d3607d2d9a6ffdf0a165993c546c43d0db): a planning-only pull request compiles
      # nothing.
      - name: Install the pinned aep release
        working-directory: ${{ runner.temp }}
        env:
          AEP_VERSION: "0.68.0"
          AEP_SHA256: 02bf6a2c4bc9a3ffd717edfb365f665491005004f159774a8847d3cbd18c5e91
        run: |
          set -euo pipefail
          asset="aep-$AEP_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/beyond10x/aep/releases/download/$AEP_VERSION"
          curl --fail --silent --show-error --location --output "$asset" "$release/$asset"
          echo "$AEP_SHA256  $asset" | sha256sum --check --strict
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/aep-$AEP_VERSION-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Validate the planning store
        working-directory: repository
        run: aep plan artifact validate
