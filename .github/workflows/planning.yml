name: Planning store

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: planning validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: repository
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: beyond10x/aep
          ref: 068478785661ed41b05146ab77858d1b94794388 # AEP 0.63.1 plus admitted ESS direct-return evidence; Git-native store
          path: aep
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build the pinned aep
        run: cargo build --manifest-path aep/Cargo.toml --locked --release -p aep-cli --bin aep
      - name: Validate the planning store
        working-directory: repository
        run: |
          aep="$GITHUB_WORKSPACE/aep/target/release/aep"
          "$aep" plan artifact validate
