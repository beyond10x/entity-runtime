# The dependency audit, on its own clock.
#
# It used to be a step of the documentation build, where a new advisory in a transitive dependency
# turned the deploy red on a commit that touched a Markdown file — a finding arriving as a broken
# deploy is a finding people learn to ignore. Here a red run means exactly one thing.
name: Audit

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm audit (website)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked dependencies
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Audit
        working-directory: website
        run: |
          set -euo pipefail
          # No exceptions. The last one, image-size (GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq),
          # ended on 2026-09-09 when website/vendor/image-size started carrying the guards upstream
          # never released; see website/vendor/image-size/B10X-PATCH.md. A new high or critical
          # advisory is a finding on its own clock, which is what this workflow is for.
          npm audit --audit-level=high
