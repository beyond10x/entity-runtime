# The dependency audit, on its own clock.
#
# It used to be a step of the documentation build, where a new advisory in a transitive dependency
# turned the deploy red on a commit that touched a Markdown file — a finding arriving as a broken
# deploy is a finding people learn to ignore. Here a red run means exactly one thing.
name: Audit

on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm audit (website)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked dependencies
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Audit
        working-directory: website
        run: |
          set -euo pipefail
          npm audit --json > audit.json || status=$?
          status="${status:-0}"
          today="$(date -u +%F)"
          if [[ "$today" > "2026-09-30" ]]; then
            echo 'The image-size advisory exception expired on 2026-09-30.' >&2
            exit 1
          fi
          unexpected="$(jq -r '
            [.vulnerabilities | to_entries[]
             | select(.value.severity == "high" or .value.severity == "critical")
             | .value.via[]
             | select(type == "object")
             | select(.source != 1138808 and .source != 1138809)
             | .source] | unique | .[]?' audit.json)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected high/critical npm advisories: $unexpected" >&2
            exit 1
          fi
          echo 'Only image-size GHSA-w3rx-r6r6-pgpr and GHSA-5p2g-fcmc-qvqq remain; exception expires 2026-09-30.'
          test "$status" -eq 1
