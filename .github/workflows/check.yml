# Every push to main and every pull request runs the gate — the same workflow release.yml calls,
# so the two cannot drift.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
