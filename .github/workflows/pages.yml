# Builds the Docusaurus site under website/ — which renders the repository's own docs/ tree — and
# deploys it to GitHub Pages on every push to main. Pull requests get the build without the deploy,
# so a dangling link (`onBrokenLinks: 'throw'`) fails before it lands.
#
# One-time repository setup this workflow needs: Settings → Pages → Source: "GitHub Actions".
# Never "Deploy from a branch → /docs": that would publish the raw tree at the public URL.
name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - docs/**
      - website/**
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - docs/**
      - website/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install locked dependencies
        working-directory: website
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        working-directory: website
        run: npm audit --audit-level=critical

      - name: Type-check website
        working-directory: website
        run: npm run typecheck

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/build

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
