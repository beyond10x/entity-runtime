# Atlas-classified former Pages workflow: repository-owned validation only; deployment authority is forbidden.
# Builds the standalone Docusaurus source and preserves its type, link and image-format gates.
name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One group per ref: two pull requests opened together must not cancel each other's required build.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install locked dependencies
        working-directory: website
        run: npm ci --ignore-scripts

      # The dependency audit remains in audit.yml so a new advisory is a finding, not a broken
      # documentation build on an otherwise unrelated change.
      - name: Type-check website
        working-directory: website
        run: npm run typecheck

      - name: Refuse image formats exposed to the temporary image-size advisory exception
        run: |
          set -euo pipefail
          if find website/docs website/static -type f \( -iname '*.icns' -o -iname '*.jxl' -o -iname '*.heif' -o -iname '*.heic' \) -print -quit | grep -q .; then
            echo 'ICNS, JXL and HEIF/HEIC assets are forbidden while the image-size exception is active.' >&2
            exit 1
          fi

      - name: Build website
        working-directory: website
        run: npm run build
