# Atlas-classified former Pages workflow: repository-owned validation only; deployment authority is forbidden.
# Builds the standalone Docusaurus source and preserves its type, link and image-format gates.
name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One group per ref: two pull requests opened together must not cancel each other's required build.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install locked dependencies
        working-directory: website
        run: npm ci --ignore-scripts

      # The dependency audit remains in audit.yml so a new advisory is a finding, not a broken
      # documentation build on an otherwise unrelated change.
      - name: Type-check website
        working-directory: website
        run: npm run typecheck

      - name: Check the vendored image-size and braces guards
        working-directory: website
        run: npm run vendor-check

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Check the generated pages and bind the built site to its source commit
        run: |
          cargo test --locked -p entity-runtime-docs
          cargo run --locked -p entity-runtime-docs -- generate --check
          cargo run --locked -p entity-runtime-docs -- provenance --site website/build --commit "$GITHUB_SHA"

      - name: Upload the exact built site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b10x-project-site
          path: website/build
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
