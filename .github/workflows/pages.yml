# Builds the standalone Docusaurus product site under website/ — its public Markdown is
# `website/docs/`, never the repository-root engineering record under `docs/` — and
# deploys it to GitHub Pages on every push to main. Pull requests get the build without the deploy,
# so a dangling link (`onBrokenLinks: 'throw'`) fails before it lands.
#
# One-time repository setup this workflow needs: Settings → Pages → Source: "GitHub Actions".
# Never "Deploy from a branch → /docs": that would serve the raw tree at the public URL.
name: Publish documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One group per ref: deploys from main still serialise, and two pull requests opened together no
# longer cancel each other's build — a PR whose link gate was cancelled reads like one that passed.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install locked dependencies
        working-directory: website
        run: npm ci --ignore-scripts

      # The dependency audit is deliberately NOT here: a new advisory in a transitive dependency
      # would turn a documentation deploy red on a commit that touched a Markdown file. It runs
      # weekly in audit.yml, where a finding is a finding rather than a broken deploy.
      - name: Type-check website
        working-directory: website
        run: npm run typecheck

      - name: Refuse image formats exposed to the temporary image-size advisory exception
        run: |
          set -euo pipefail
          if find website/docs website/static -type f \( -iname '*.icns' -o -iname '*.jxl' -o -iname '*.heif' -o -iname '*.heic' \) -print -quit | grep -q .; then
            echo 'ICNS, JXL and HEIF/HEIC assets are forbidden while the image-size exception is active.' >&2
            exit 1
          fi

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/build

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
