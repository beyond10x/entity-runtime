version: 2
updates:
  # Grouped so a Monday morning brings one pull request per ecosystem rather than five: ten
  # concurrent site builds racing for the same npm registry produced noise, not signal.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      docusaurus:
        patterns: ["@docusaurus/*", "@mdx-js/*", "react", "react-dom", "prism-react-renderer", "clsx"]
      types:
        patterns: ["@types/*", "typescript"]
    ignore:
      # TypeScript 7 is refused by `@docusaurus/tsconfig`'s settings today: the bump fails
      # `npm run typecheck`, which is a real gate, not a flake. Revisit when Docusaurus ships
      # support; until then a major bump here is noise with a red check attached.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns: ["*"]
